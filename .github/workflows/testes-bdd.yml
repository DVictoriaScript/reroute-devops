name: Testes BDD da API

on:
  pull_request:
  push:
    branches:
      - '*'

jobs:
  testes-bdd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Subir a API em modo de teste (banco em memória)
        run: docker compose -f docker-compose.testes.yml up -d --build

      - name: Aguardar o /health da API
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then
              echo ""
              echo "API no ar"
              exit 0
            fi
            echo "Tentativa $i: API ainda subindo, aguardando 5s..."
            sleep 5
          done
          echo "A API não respondeu no /health"
          docker compose -f docker-compose.testes.yml logs api
          exit 1

      - name: Configurar o JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Rodar os testes
        working-directory: testes-bdd
        run: mvn clean test

      - name: Publicar o relatório do Cucumber
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-cucumber
          path: testes-bdd/target/cucumber-reports.html

      - name: Logs da API em caso de falha
        if: failure()
        run: docker compose -f docker-compose.testes.yml logs api

      - name: Derrubar a API
        if: always()
        run: docker compose -f docker-compose.testes.yml down
