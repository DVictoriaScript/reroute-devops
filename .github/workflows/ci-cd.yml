name: CI/CD ReRoute API

# Integração contínua em todo push e pull request nas branches main e develop.
# Entrega contínua: develop -> staging (homologação) e main -> production,
# com imagem no Docker Hub e deploy no Azure Web App.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  DOTNET_VERSION: "8.0.x"
  IMAGE_NAME: reroute-api

jobs:
  build-test:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar dependências
        run: dotnet restore ReRoute.Api.sln

      - name: Compilar em Release
        run: dotnet build ReRoute.Api.sln -c Release --no-restore

      - name: Rodar testes
        run: dotnet test ReRoute.Api.sln -c Release --no-build --logger "trx;LogFileName=resultados.trx" --results-directory TestResults

      - name: Publicar resultado dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-testes
          path: TestResults/*.trx

  docker:
    name: Build e push da imagem no Docker Hub
    needs: build-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      publicado: ${{ steps.verificar.outputs.publicado }}
    steps:
      - name: Verificar secrets do Docker Hub
        id: verificar
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::warning::Secrets DOCKERHUB_USERNAME/DOCKERHUB_TOKEN não configurados. Build e push da imagem ignorados."
            echo "publicado=false" >> "$GITHUB_OUTPUT"
          else
            echo "publicado=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Definir tag do ambiente
        id: tag
        if: steps.verificar.outputs.publicado == 'true'
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "ambiente=latest" >> "$GITHUB_OUTPUT"
          else
            echo "ambiente=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Git Checkout
        if: steps.verificar.outputs.publicado == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.verificar.outputs.publicado == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: steps.verificar.outputs.publicado == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push container image to registry
        if: steps.verificar.outputs.publicado == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.ambiente }}

  deploy-staging:
    name: Deploy em staging (homologação)
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url || vars.APP_URL }}
    steps:
      - name: Verificar configuração do ambiente
        id: verificar
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          IMAGEM_PUBLICADA: ${{ needs.docker.outputs.publicado }}
        run: |
          if [ "$IMAGEM_PUBLICADA" != "true" ]; then
            echo "::warning::A imagem não foi publicada no Docker Hub. Deploy em staging ignorado."
            echo "configurado=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$PUBLISH_PROFILE" ] || [ -z "$APP_NAME" ]; then
            echo "::warning::Secret AZURE_WEBAPP_PUBLISH_PROFILE ou variável AZURE_WEBAPP_NAME não configurados no environment staging. Deploy ignorado."
            echo "configurado=false" >> "$GITHUB_OUTPUT"
          else
            echo "configurado=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        if: steps.verificar.outputs.configurado == 'true'
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: 'production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: 'index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'

      - name: Verificar /health da aplicação
        if: steps.verificar.outputs.configurado == 'true'
        env:
          APP_URL: ${{ vars.APP_URL || steps.deploy-to-webapp.outputs.webapp-url }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::warning::Variável APP_URL não configurada no environment staging. Verificação ignorada."
            exit 0
          fi
          APP_URL="${APP_URL%/}"
          sleep 30
          for i in $(seq 1 20); do
            if curl -fsS --max-time 20 "$APP_URL/health"; then
              echo ""
              echo "Aplicação respondendo em $APP_URL/health"
              exit 0
            fi
            echo "Tentativa $i sem resposta, aguardando 15s..."
            sleep 15
          done
          echo "A aplicação não respondeu no /health depois de 5 minutos."
          exit 1

  deploy-production:
    name: Deploy em produção
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url || vars.APP_URL }}
    steps:
      - name: Verificar configuração do ambiente
        id: verificar
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          IMAGEM_PUBLICADA: ${{ needs.docker.outputs.publicado }}
        run: |
          if [ "$IMAGEM_PUBLICADA" != "true" ]; then
            echo "::warning::A imagem não foi publicada no Docker Hub. Deploy em produção ignorado."
            echo "configurado=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$PUBLISH_PROFILE" ] || [ -z "$APP_NAME" ]; then
            echo "::warning::Secret AZURE_WEBAPP_PUBLISH_PROFILE ou variável AZURE_WEBAPP_NAME não configurados no environment production. Deploy ignorado."
            echo "configurado=false" >> "$GITHUB_OUTPUT"
          else
            echo "configurado=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        if: steps.verificar.outputs.configurado == 'true'
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: 'production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: 'index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'

      - name: Verificar /health da aplicação
        if: steps.verificar.outputs.configurado == 'true'
        env:
          APP_URL: ${{ vars.APP_URL || steps.deploy-to-webapp.outputs.webapp-url }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::warning::Variável APP_URL não configurada no environment production. Verificação ignorada."
            exit 0
          fi
          APP_URL="${APP_URL%/}"
          sleep 30
          for i in $(seq 1 20); do
            if curl -fsS --max-time 20 "$APP_URL/health"; then
              echo ""
              echo "Aplicação respondendo em $APP_URL/health"
              exit 0
            fi
            echo "Tentativa $i sem resposta, aguardando 15s..."
            sleep 15
          done
          echo "A aplicação não respondeu no /health depois de 5 minutos."
          exit 1
